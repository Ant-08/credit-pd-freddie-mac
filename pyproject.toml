[project]
name = "credit-pd"
version = "0.1.0"
description = "Probability-of-default model on Freddie Mac loan-level data, with bank-style validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=16",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "optbinning>=0.19",
  "optuna>=3.6",
  "shap>=0.45",
  "mlflow>=2.14",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "matplotlib>=3.8",
  "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "jupyterlab>=4", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_pd"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
